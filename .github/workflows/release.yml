# Publishes mcproxy releases; the daemon updates by checking out their tags.
# Stable: every push to main, a patch bump of the latest stable tag, marked
# latest. Nightly: manual, from any ref, `vX.Y.(Z+1)-nightly.YYYYMMDD.<run>`
# on top of the latest stable, published as a prerelease. Versions live only
# in tags; `apps/server/src/release-tag.ts` picks them.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to publish as a nightly
        type: string
        required: true
        default: main

# One run per channel at a time, so two pushes never pick the same tag.
concurrency:
  group: release-${{ github.event_name == 'push' && 'stable' || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.event_name == 'push' && 'stable' || 'nightly' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pick the tag
        id: version
        working-directory: apps/server
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: pnpm exec tsx src/release-tag.ts "$CHANNEL" | tee -a "$GITHUB_OUTPUT"

      - if: steps.version.outputs.skip != 'true'
        run: pnpm typecheck

      - if: steps.version.outputs.skip != 'true'
        run: pnpm test

      - if: steps.version.outputs.skip != 'true'
        run: pnpm build

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          flags=(--title "$TAG" --target "$(git rev-parse HEAD)" --generate-notes)
          if [ -n "$PREVIOUS" ]; then flags+=(--notes-start-tag "$PREVIOUS"); fi
          if [ "$CHANNEL" = stable ]; then
            flags+=(--latest)
          else
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${flags[@]}"
